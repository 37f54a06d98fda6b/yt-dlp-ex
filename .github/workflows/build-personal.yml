name: Build personal binaries

on:
  workflow_dispatch:

  # Optional: remove this block for manual-only builds.
  schedule:
    - cron: "23 23 * * *"

permissions:
  contents: read

# Do not cancel an active build when another run is requested.
concurrency:
  group: personal-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare build version
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Generate timestamp-based version
        id: version
        shell: bash
        run: |
          echo "version=$(date -u +'%Y.%m.%d.%H%M%S')" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux x86-64
    needs: prepare
    runs-on: ubuntu-24.04

    env:
      CHANNEL: nightly
      ORIGIN: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      EXE_NAME: yt-dlp_linux
      PYTHON_VERSION: "3.14"

      # Build both the single executable and the directory-based ZIP.
      SKIP_ONEDIR_BUILD: ""
      SKIP_ONEFILE_BUILD: ""

      # Do not run the upstream downgrade/update test.
      UPDATE_TO: ""

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build executable using existing Docker configuration
        env:
          SERVICE: linux_x86_64
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./dist

          pushd bundle/docker
          docker compose up --build --exit-code-from "${SERVICE}" "${SERVICE}"
          popd

          sudo chown "${USER}:docker" "./dist/${EXE_NAME}"

      - name: Verify executable in container
        env:
          SERVICE: linux_x86_64_verify
        shell: bash
        run: |
          set -euo pipefail

          cd bundle/docker
          docker compose up --build --exit-code-from "${SERVICE}" "${SERVICE}"

      - name: Upload Linux binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: personal-linux-x86_64
          path: |
            dist/yt-dlp_linux
            dist/yt-dlp_linux.zip
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows x64
    needs: prepare
    runs-on: windows-2025

    defaults:
      run:
        shell: pwsh

    env:
      CHANNEL: nightly
      ORIGIN: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python x64
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          architecture: x64
          check-latest: true

      - name: Install requirements
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          python -m venv /yt-dlp-build-venv
          /yt-dlp-build-venv/Scripts/Activate.ps1

          python -m pip install -U --require-hashes -r "bundle/requirements/pip.txt"
          python -m pip install -U --require-hashes -r "bundle/requirements/win-x64-pyinstaller.txt"
          python -m pip install -U --require-hashes -r "bundle/requirements/curl-cffi.txt"

      - name: Prepare source
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          /yt-dlp-build-venv/Scripts/Activate.ps1

          python devscripts/update-version.py -c "${Env:CHANNEL}" -r "${Env:ORIGIN}" "${Env:VERSION}"
          python devscripts/make_lazy_extractors.py

      - name: Build executable and directory-based ZIP
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          /yt-dlp-build-venv/Scripts/Activate.ps1

          python -m bundle.pyinstaller
          python -m bundle.pyinstaller --onedir

          Compress-Archive -Path ./dist/yt-dlp/* -DestinationPath ./dist/yt-dlp_win.zip

      - name: Verify executable
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          & ./dist/yt-dlp.exe --version

      - name: Upload Windows binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: personal-windows-x64
          path: |
            dist/yt-dlp.exe
            dist/yt-dlp_win.zip
          if-no-files-found: error
          compression-level: 0

  checksums:
    name: Generate checksums
    needs: [linux, windows]
    runs-on: ubuntu-24.04

    steps:
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: personal-*
          merge-multiple: true

      - name: Generate SHA-256 and SHA-512 checksums
        shell: bash
        run: |
          set -euo pipefail

          cd dist

          files=(
            yt-dlp_linux
            yt-dlp_linux.zip
            yt-dlp.exe
            yt-dlp_win.zip
          )

          sha256sum -- "${files[@]}" | tee ../SHA2-256SUMS
          sha512sum -- "${files[@]}" | tee ../SHA2-512SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: personal-checksums
          path: |
            SHA2-256SUMS
            SHA2-512SUMS
          if-no-files-found: error
